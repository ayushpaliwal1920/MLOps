# Name of the workflow

name: CI workflow


# This includes the events that will trigger the workflow. In this case, it will run on push and pull request events to the main branch.
on: 
  push:
    branches:
      - main
      - data-versioning
      - feature/continuous-integration
      - experiment-tracking-mlflow
  pull_request:
    branches:
      - main

# This section defines the jobs that will be run as part of the workflow. In this case, there is a single job called "build" that runs on an Ubuntu runner.

jobs:
  build:  # Name of the job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code  # Name of the step(anything you want to name it)
        uses: actions/checkout@v4 # This step checks out the code from the repository so that it can be used in subsequent steps.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest streamlit

      - name: Run tests
        run: |
          pytest
          
